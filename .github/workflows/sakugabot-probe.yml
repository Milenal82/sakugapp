name: Read public Sakugabot tag schema
on:
  push:
    branches: [ci/sakugabot-read]
permissions:
  contents: write
jobs:
  read:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Read three public tags without authentication or retries
        run: |
          python3 - <<'PYCODE'
          import urllib.request,urllib.parse,json,time,pathlib,datetime
          results=[]
          for name in ['mob_psycho_100','yoshinari_you','mokmok']:
              url='https://sakugabot.pw/api/tags/'+urllib.parse.quote(name,safe='')+'/'
              item={'tag':name,'url':url}
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Sakugapp read-only schema verification'}),timeout=20) as r:
                      raw=r.read(1048577)
                      assert len(raw)<=1048576
                      item.update(status=r.status,content_type=r.headers.get('Content-Type'))
                      try:item['response']=json.loads(raw)
                      except json.JSONDecodeError:item['body_excerpt']=raw[:500].decode(errors='replace')
              except Exception as e:item['error']=str(e)
              results.append(item)
              time.sleep(1)
          pathlib.Path('/tmp/sakugabot-probe.json').write_text(json.dumps({'verified_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'requests':results},ensure_ascii=False,indent=2)+'\n')
          PYCODE
      - name: Save bounded public read results on an isolated branch
        run: |
          git fetch origin evidence/sakugabot-api:refs/remotes/origin/evidence/sakugabot-api || true
          if git show-ref --verify --quiet refs/remotes/origin/evidence/sakugabot-api; then git switch -c evidence origin/evidence/sakugabot-api; else git switch --orphan evidence; git rm -rf --ignore-unmatch .; fi
          cp /tmp/sakugabot-probe.json sakugabot-probe.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sakugabot-probe.json
          git commit -m 'Record bounded public Sakugabot schema verification' || true
          git push origin HEAD:refs/heads/evidence/sakugabot-api
