name: Content-first Debug validation
on:
  push:
    branches: [ui/content-first-refresh]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: content-first-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: ./scripts/ci-android-sdk.sh
      - uses: gradle/actions/setup-gradle@v5
      - run: python3 scripts/check-localization.py
      - run: ./gradlew --no-daemon assembleDebugAndroidTest
      - run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SAKUGAPP-ContentFirst-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-first-build-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.html
  devices:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 28
            profile: Nexus S
          - api: 35
            profile: pixel_c
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: ./scripts/ci-android-sdk.sh
      - uses: gradle/actions/setup-gradle@v5
      - run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          profile: ${{ matrix.profile }}
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/run-content-first-checks.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-first-device-reports-${{ matrix.api }}
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            app/build/reports/ui-evidence/
            app/build/reports/content-first-diagnostics/
  performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: ./scripts/ci-android-sdk.sh
      - uses: gradle/actions/setup-gradle@v5
      - name: Build the exact main baseline and current Debug APKs
        run: bash scripts/build-content-first-benchmark.sh
      - run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_c
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/run-content-first-benchmark.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-first-performance-reports
          path: app/build/reports/content-first-performance-reports/
  evidence:
    needs: [build, devices, performance]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: content-first-*-reports*
          path: ${{ runner.temp }}/reports
      - name: Record bounded Debug results and original fixture captures
        env:
          GH_TOKEN: ${{ github.token }}
          CONTENT_FIRST_INPUT: ${{ runner.temp }}/reports
          CONTENT_FIRST_OUTPUT: ${{ runner.temp }}/content-first-evidence
          CONTENT_FIRST_RESULT: ${{ needs.build.result == 'success' && needs.devices.result == 'success' && needs.performance.result == 'success' && 'success' || 'failure' }}
        run: python3 scripts/record-content-first-evidence.py
      - uses: actions/upload-artifact@v4
        with:
          name: content-first-validation-evidence
          path: ${{ runner.temp }}/content-first-evidence/
      - name: Keep evidence separate from app source and main
        run: |
          git fetch origin evidence/content-first-refresh:refs/remotes/origin/evidence/content-first-refresh || true
          if git show-ref --verify --quiet refs/remotes/origin/evidence/content-first-refresh; then
            git switch -c evidence origin/evidence/content-first-refresh
          else
            git switch --orphan evidence
            git rm -rf --ignore-unmatch .
          fi
          cp "$RUNNER_TEMP/content-first-evidence/report.json" report.json
          mkdir -p screenshots
          cp "$RUNNER_TEMP/content-first-evidence/screenshots/"*.png screenshots/ 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add report.json screenshots
          git commit -m "Record content-first Debug evidence for $GITHUB_SHA" || true
          git push origin HEAD:refs/heads/evidence/content-first-refresh
