name: Read Debug-only diagnostics
on:
  push:
    branches: [ci/player-tools-audit]
permissions:
  contents: write
  actions: read
jobs:
  read:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Read only Debug reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import subprocess,json,zipfile,io,xml.etree.ElementTree as E,pathlib
          repo='Milenal82/sakugapp'
          def api(p):return subprocess.check_output(['gh','api',f'repos/{repo}/'+p])
          results=[]
          for run in ['42460910586']:
              meta=json.loads(api('actions/runs/'+run))
              assert meta['path']=='.github/workflows/debug-only.yml' and meta['head_branch']=='dev/debug-actions-grid-artist'
              result={'run':run,'sha':meta['head_sha'],'status':meta['status'],'conclusion':meta['conclusion'],'jobs':[],'artifacts':[],'reports':[]}
              for job in json.loads(api(f'actions/runs/{run}/jobs?per_page=100'))['jobs']:
                  info={'id':job['id'],'name':job['name'],'conclusion':job['conclusion'],'steps':job['steps']}
                  if job['conclusion']=='failure':
                      try:info['errors']=api(f'actions/jobs/{job["id"]}/logs').decode(errors='replace')[-26000:]
                      except Exception:pass
                  result['jobs'].append(info)
              for item in json.loads(api(f'actions/runs/{run}/artifacts?per_page=100'))['artifacts']:
                  result['artifacts'].append({'name':item['name'],'url':f'https://github.com/{repo}/actions/runs/{run}/artifacts/{item["id"]}'})
                  if 'reports' not in item['name'] or item['size_in_bytes']>64*1024*1024:continue
                  archive=zipfile.ZipFile(io.BytesIO(api(f'actions/artifacts/{item["id"]}/zip')))
                  for p in archive.infolist():
                      name=pathlib.PurePosixPath(p.filename).name
                      if p.file_size>4*1024*1024:continue
                      if name.startswith('debug-') and name.endswith('.png'):
                          dest=pathlib.Path('/tmp/debug-captures')/(item['name']+'-'+name);dest.parent.mkdir(exist_ok=True);dest.write_bytes(archive.read(p))
                      if name.startswith('TEST-') and name.endswith('.xml'):
                          root=E.fromstring(archive.read(p));failures=[]
                          for c in root.iter('testcase'):
                              for error in list(c.findall('failure'))+list(c.findall('error')):failures.append({'test':c.get('classname')+'.'+c.get('name'),'message':(error.text or '')[:12000]})
                          result['reports'].append({'artifact':item['name'],'counts':root.attrib,'failures':failures})
                      if name.startswith('lint-results-') and name.endswith('.xml'):
                          lint=E.fromstring(archive.read(p));result['lint']={'errors':sum(i.get('severity') in ['Error','Fatal'] for i in lint.findall('issue')),'warnings':sum(i.get('severity')=='Warning' for i in lint.findall('issue'))}
              results.append(result)
          pathlib.Path('/tmp/debug-diagnostics.json').write_text(json.dumps(results,indent=2)+'\n')
          PYCODE
      - name: Save Debug evidence on isolated branch
        run: |
          git fetch origin evidence/player-diagnostics:refs/remotes/origin/evidence/player-diagnostics
          git switch -c diagnostics origin/evidence/player-diagnostics
          cp /tmp/debug-diagnostics.json debug-report.json
          if [ -d /tmp/debug-captures ]; then cp -r /tmp/debug-captures screenshots-debug; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add debug-report.json
          if [ -d screenshots-debug ]; then git add screenshots-debug; fi
          git commit -m 'Read Debug-only reports' || true
          git push origin HEAD:refs/heads/evidence/player-diagnostics
