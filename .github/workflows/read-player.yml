name: Read Debug performance evidence
on:
  push:
    branches: [ci/player-tools-audit]
permissions:
  contents: write
  actions: read
jobs:
  read:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Read only performance Debug jobs and reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import subprocess,json,zipfile,io,xml.etree.ElementTree as E,pathlib,collections,re,statistics
          repo='Milenal82/sakugapp'
          def api(p):return subprocess.check_output(['gh','api',f'repos/{repo}/'+p])

          def summarize_trace(raw,app_pid):
              stack=collections.defaultdict(list);spans=[];phases=[]
              line_re=re.compile(r'^\s*(.*?)\s*-(\d+)\s+.*?\s(\d+\.\d+):\s+tracing_mark_write:\s*(.*)$')
              for line in raw.splitlines():
                  m=line_re.match(line)
                  if not m:continue
                  thread,tid,stamp,event=m.groups();tid=int(tid);stamp=float(stamp)
                  if event.startswith('B|'):
                      parts=event.split('|',2)
                      if len(parts)==3:stack[tid].append((stamp,parts[2],int(parts[1]),thread))
                  elif event.startswith('E') and stack[tid]:
                      start,name,pid,thread=stack[tid].pop()
                      if name.startswith('sakugapp:'):phases.append((start,stamp,name))
                      elif pid==app_pid and (tid==app_pid or 'RenderThread' in thread):
                          spans.append((start,stamp,re.sub(r'\s+\d.*$','',name),'main' if tid==app_pid else 'RenderThread'))
              result=[]
              for start,end,name in phases:
                  groups=collections.defaultdict(list)
                  for s,e,n,role in spans:
                      if start<=s<=e<=end:groups[(role,n)].append((e-s)*1000)
                  records=[]
                  for (role,n),values in groups.items():
                      values.sort()
                      records.append(dict(thread=role,slice=n,count=len(values),total_ms=round(sum(values),2),p50_ms=round(statistics.median(values),3),p95_ms=round(values[min(len(values)-1,int(len(values)*.95))],3),max_ms=round(values[-1],3)))
                  result.append(dict(phase=name,start_s=start,end_s=end,slices=sorted(records,key=lambda r:-r['total_ms'])[:35]))
              return dict(phase_count=len(phases),completed_main_render_slices=len(spans),phases=result,definition='Wall durations of complete app-pid tracing slices inside measurement markers; nested durations overlap, not CPU time or scheduler blocked-time')
          results=[]
          for run in ['42492222618']:
              meta=json.loads(api('actions/runs/'+run))
              assert meta['path']=='.github/workflows/performance-debug.yml' and meta['head_branch']=='dev/performance-navigation'
              result={'run':run,'sha':meta['head_sha'],'status':meta['status'],'conclusion':meta['conclusion'],'jobs':[],'artifacts':[],'reports':[],'profiles':[]}
              for job in json.loads(api(f'actions/runs/{run}/jobs?per_page=100'))['jobs']:
                  info={'id':job['id'],'name':job['name'],'conclusion':job['conclusion'],'steps':job['steps']}
                  if job['name'].startswith('profile'):
                      try:
                          log=api(f'actions/jobs/{job["id"]}/logs').decode(errors='replace')
                          info['errors']=log[-18000:] if job['conclusion'] in ['failure','cancelled'] else ''
                          for match in re.finditer(r'PERFORMANCE_REPORT (\{[^\n]+\})',log):
                              result['profiles'].append({'artifact':'job-log','path':str(job['id']),'data':json.loads(match.group(1))})
                      except Exception as e:info['log_status']=str(e)[-500:]
                  result['jobs'].append(info)
              for item in json.loads(api(f'actions/runs/{run}/artifacts?per_page=100'))['artifacts']:
                  result['artifacts'].append({'name':item['name'],'url':f'https://github.com/{repo}/actions/runs/{run}/artifacts/{item["id"]}'})
                  if 'apk' in item['name'] or item['size_in_bytes']>128*1024*1024:continue
                  archive=zipfile.ZipFile(io.BytesIO(api(f'actions/artifacts/{item["id"]}/zip')))
                  for p in archive.infolist():
                      name=pathlib.PurePosixPath(p.filename).name
                      if 'build' not in item['name']:result.setdefault('files',[]).append(p.filename)
                      if p.file_size>16*1024*1024 and not (name.endswith('.atrace') and p.file_size<=96*1024*1024):continue
                      if name.endswith(('.txt','.log')) and p.file_size<8*1024*1024:
                          raw=archive.read(p).decode(errors='replace')
                          if name.startswith('runner-'):
                              ok=re.search(r'^OK \(([0-9]+) tests?\)',raw,re.M)
                              result.setdefault('native_tests',[]).append({'artifact':item['name'],'path':p.filename,'passed_count':int(ok.group(1)) if ok else None,'tail':raw[-10000:] if not ok else ''})
                          if name.startswith('logcat'):
                              result.setdefault('log_samples',[]).append({'path':p.filename,'lines':[line[-4500:] for line in raw.splitlines() if 'PERF' in line][:3]})
                          for match in re.finditer(r'PERF (\{[^\n]+\})',raw):
                              try:result.setdefault('phase_logs',[]).append({'artifact':item['name'],'path':p.filename,'data':json.loads(match.group(1))})
                              except json.JSONDecodeError:pass
                          messages=re.findall(r'System\.out\s*(?:\([^)]*\))?\s*:\s?(.*)',raw)
                          joined=''.join(messages)
                          marker=joined.find('PERFORMANCE_REPORT ')
                          if marker>=0:
                              try:
                                  value,_=json.JSONDecoder().raw_decode(joined[marker+len('PERFORMANCE_REPORT '):]);result['profiles'].append({'artifact':item['name'],'path':p.filename,'data':value})
                              except json.JSONDecodeError:pass
                          for match in re.finditer(r'PERFORMANCE_REPORT (\{[^\n]+\})',raw):
                              try:result['profiles'].append({'artifact':item['name'],'path':p.filename,'data':json.loads(match.group(1))})
                              except json.JSONDecodeError:pass
                      if name.startswith('perf-') and name.endswith('.json'):
                          result['profiles'].append({'artifact':item['name'],'path':p.filename,'data':json.loads(archive.read(p))})
                      if name.startswith('perf-') and name.endswith('.atrace'):
                          raw=archive.read(p).decode(errors='replace')
                          if name.startswith('runner-'):
                              ok=re.search(r'^OK \(([0-9]+) tests?\)',raw,re.M)
                              result.setdefault('native_tests',[]).append({'artifact':item['name'],'path':p.filename,'passed_count':int(ok.group(1)) if ok else None,'tail':raw[-10000:] if not ok else ''})
                          markers=collections.Counter(re.findall(r'tracing_mark_write: B\|\d+\|([^\n]+)',raw))
                          peer=p.filename.rsplit('/',1)[0]+'/'+name.replace('-scroll.atrace','.json')
                          pid=json.loads(archive.read(peer)).get('pid') if peer in archive.namelist() else None
                          result.setdefault('traces',[]).append({'artifact':item['name'],'path':p.filename,'bytes':p.file_size,'frequent_slices':markers.most_common(30),'analysis':summarize_trace(raw,pid)})
                      if (name.startswith('perf-') and name.endswith(('-middle.png','-after.png'))) or name=='reset-failed.png':
                          parts=pathlib.PurePosixPath(p.filename)
                          if parts.is_absolute() or '..' in parts.parts:continue
                          dest=pathlib.Path('/tmp/performance-evidence')/run/item['name']/parts;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(archive.read(p))
                      if name=='reset-failed.xml':result.setdefault('reset_hierarchies',[]).append({'artifact':item['name'],'path':p.filename,'xml':archive.read(p).decode(errors='replace')[:60000]})
                      if name.startswith('TEST-') and name.endswith('.xml'):
                          raw=archive.read(p).decode(errors='replace')
                          if name.startswith('runner-'):
                              ok=re.search(r'^OK \(([0-9]+) tests?\)',raw,re.M)
                              result.setdefault('native_tests',[]).append({'artifact':item['name'],'path':p.filename,'passed_count':int(ok.group(1)) if ok else None,'tail':raw[-10000:] if not ok else ''})
                          root=E.fromstring(raw);failures=[]
                          for match in re.finditer(r'PERFORMANCE_REPORT (\{[^\n]+\})', ''.join(root.itertext())):
                              try:result['profiles'].append({'artifact':item['name'],'path':p.filename,'data':json.loads(match.group(1))})
                              except json.JSONDecodeError:pass
                          for c in root.iter('testcase'):
                              for error in list(c.findall('failure'))+list(c.findall('error')):failures.append({'test':c.get('classname')+'.'+c.get('name'),'message':(error.text or '')[:12000]})
                          result['reports'].append({'artifact':item['name'],'counts':root.attrib,'failures':failures})
                      if name.startswith('lint-results-') and name.endswith('.xml'):
                          lint=E.fromstring(archive.read(p));result['lint']={'errors':sum(i.get('severity') in ['Error','Fatal'] for i in lint.findall('issue')),'warnings':sum(i.get('severity')=='Warning' for i in lint.findall('issue'))}
              results.append(result)
          pathlib.Path('/tmp/performance-report.json').write_text(json.dumps(results,indent=2)+'\n')
          PY
      - name: Save read-only diagnostics on isolated evidence branch
        run: |
          git fetch origin evidence/player-diagnostics:refs/remotes/origin/evidence/player-diagnostics
          git switch -c diagnostics origin/evidence/player-diagnostics
          cp /tmp/performance-report.json performance-report.json
          mkdir -p performance-evidence
          if [ -d /tmp/performance-evidence ]; then cp -r /tmp/performance-evidence/. performance-evidence/; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add performance-report.json performance-evidence
          git commit -m 'Read Debug performance evidence' || true
          git push origin HEAD:refs/heads/evidence/player-diagnostics
