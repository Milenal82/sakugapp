name: Read completed player test diagnostics
on:
  push:
    branches: [ci/player-tools-audit]
permissions:
  contents: write
  actions: read
jobs:
  read:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Read existing report artifacts only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import subprocess,json,zipfile,io,xml.etree.ElementTree as ET,pathlib,time,re
          repo='Milenal82/sakugapp';output=[]
          def api(path):return subprocess.check_output(['gh','api',f'repos/{repo}/'+path])
          for run in ['42262821578','42262821447']:
              meta=json.loads(api('actions/runs/'+run));result={'run':run,'commit':meta['head_sha'],'status':meta['status'],'reports':[]}
              for attempt in range(1):
                  items=json.loads(api(f'actions/runs/{run}/artifacts?per_page=100'))['artifacts']
                  meta=json.loads(api('actions/runs/'+run))
                  if meta['status']=='completed' or {'extension-device-reports-28','extension-device-reports-35','extension-build-reports'}.issubset({i['name'] for i in items}):break
                  time.sleep(20)
              result['status']=meta['status'];result['conclusion']=meta['conclusion']
              result['jobs']=[]
              for job in json.loads(api(f'actions/runs/{run}/jobs?per_page=100'))['jobs']:
                  detail={'name':job['name'],'conclusion':job['conclusion']}
                  if job['conclusion']=='failure':
                      try:
                          log=subprocess.check_output(['gh','api','--allow-escape-sequences',f'repos/{repo}/actions/jobs/{job["id"]}/logs']).decode(errors='replace')
                          detail['errors']='\n'.join(line for line in log.splitlines() if any(k in line for k in ['AssertionError','e: file:','FAILED','What went wrong','Caused by:','##[error]','Could not','Lint found','> Task :app:']))[-14000:]
                      except Exception:detail['errors']='See failed job logs'
                  result['jobs'].append(detail)
              result['artifacts']=[{'name':i['name'],'url':f'https://github.com/{repo}/actions/runs/{run}/artifacts/{i["id"]}'} for i in items]
              for item in items:
                  if 'reports' not in item['name'] or item['size_in_bytes']>64*1024*1024:continue
                  z=zipfile.ZipFile(io.BytesIO(api(f'actions/artifacts/{item["id"]}/zip')))
                  for p in z.infolist():
                      name=pathlib.PurePosixPath(p.filename).name
                      if p.file_size>4*1024*1024:continue
                      if name.startswith(('extension-','v130-','search-ime-','stability-')) and name.endswith('.png'):
                          dest=pathlib.Path('/tmp/extension-captures')/(item['name']+'-'+name);dest.parent.mkdir(exist_ok=True);dest.write_bytes(z.read(p))
                      if name.startswith('lint-results-') and name.endswith('.xml'):
                          lint=ET.fromstring(z.read(p));result['lint']={'errors':sum(i.get('severity') in ['Error','Fatal'] for i in lint.findall('issue')),'warnings':sum(i.get('severity')=='Warning' for i in lint.findall('issue'))}
                      if not name.startswith('TEST-') or not name.endswith('.xml'):continue
                      root=ET.fromstring(z.read(p));f=[]
                      for c in root.iter('testcase'):
                          for e in list(c.findall('failure'))+list(c.findall('error')):f.append({'test':c.get('classname')+'.'+c.get('name'),'message':(e.text or '')[:10000]})
                      result['reports'].append({'artifact':item['name'],'counts':root.attrib,'failures':f})
              output.append(result)
          pathlib.Path('/tmp/player-diagnostics.json').write_text(json.dumps(output,indent=2)+'\n')
          PY
      - name: Save diagnostics independently of product source
        run: |
          git fetch origin evidence/player-diagnostics:refs/remotes/origin/evidence/player-diagnostics || true
          if git show-ref --verify --quiet refs/remotes/origin/evidence/player-diagnostics; then git switch -c diagnostics origin/evidence/player-diagnostics; else git switch --orphan diagnostics; fi
          cp /tmp/player-diagnostics.json report.json
          if [ -d /tmp/extension-captures ]; then cp -r /tmp/extension-captures screenshots-extension; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add report.json
          if [ -d screenshots-extension ]; then git add screenshots-extension; fi
          git commit -m 'Read existing player reports' || true
          git push origin HEAD:refs/heads/evidence/player-diagnostics
