name: v1.3.0 UI and prerequisite validation
on:
  push:
    branches: [feature/v1.3.0-ui-refinement, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: refinement-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 scripts/check-localization.py
      - run: python3 -m unittest discover -s scripts/tests -v
      - name: Verify released version metadata without accessing signing material
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import subprocess,json,re,pathlib
          releases=json.loads(subprocess.check_output(['gh','api','repos/Milenal82/sakugapp/releases?per_page=100']))
          assert not any(r["tag_name"]=="v1.3.0" for r in releases), "v1.3.0 already exists; stop rather than replace it."
          codes={}
          for r in releases:
              if r['draft'] or r['prerelease']:continue
              tag=r['tag_name']
              if tag=='v1.3.0':continue
              assert re.fullmatch(r'v\d+\.\d+\.\d+',tag)
              source=subprocess.check_output(['git','show',tag+':app/build.gradle.kts'],text=True)
              codes[tag]=int(re.search(r'versionCode\s*=\s*(\d+)',source)[1])
          assert codes and max(codes.values())<16 and 'v1.2.2' in codes
          pathlib.Path('v130-metadata.json').write_text(json.dumps({'previous':'v1.2.2','published_version_codes':codes,'candidate_versionCode':16,'candidate_versionName':'1.3.0'},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v130-metadata
          path: v130-metadata.json
  devices:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 28
            profile: Nexus S
          - api: 35
            profile: pixel_c
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: ./scripts/ci-android-sdk.sh
      - uses: gradle/actions/setup-gradle@v5
      - run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/run-refinement-checks.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v130-device-reports-${{ matrix.api }}
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            app/build/reports/ui-evidence/
  evidence:
    needs: [metadata, devices]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: v130-*
          path: ${{ runner.temp }}/reports
      - name: Read actual scoped and standard checks for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_DOWNLOADS: ${{ runner.temp }}/reports
          EVIDENCE_OUTPUT: ${{ runner.temp }}/evidence
          VALIDATION_RESULT: ${{ needs.metadata.result == 'success' && needs.devices.result == 'success' && 'success' || 'failure' }}
        run: python3 scripts/record-refinement-evidence.py
      - uses: actions/upload-artifact@v4
        with:
          name: v130-validation-evidence
          path: ${{ runner.temp }}/evidence/
      - name: Keep original captures and bounded reports independently of app source
        run: |
          git fetch origin evidence/v130:refs/remotes/origin/evidence/v130 || true
          if git show-ref --verify --quiet refs/remotes/origin/evidence/v130; then git switch -c evidence origin/evidence/v130; else git switch --orphan evidence; git rm -rf .; fi
          cp "$RUNNER_TEMP/evidence/report.json" report.json
          mkdir -p screenshots
          cp "$RUNNER_TEMP/evidence/screenshots/"*.png screenshots/ 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add report.json screenshots
          git commit -m "v1.3.0 validation for $GITHUB_SHA" || true
          git push origin HEAD:refs/heads/evidence/v130
