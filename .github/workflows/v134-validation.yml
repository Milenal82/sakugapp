name: v1.3.4 candidate validation (no publication)
on:
  push:
    branches: [dev/v134-ui-polish, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v134-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: ./scripts/ci-android-sdk.sh
      - uses: gradle/actions/setup-gradle@v5
      - name: Check existing releases and monotonic version code (read only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import subprocess,json,pathlib,re,os
          releases=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/releases?per_page=100']))
          assert not any(r['tag_name']=='v1.3.4' for r in releases), 'v1.3.4 already exists; do not overwrite.'
          published={}
          for r in releases:
              if r['draft'] or r['prerelease']:continue
              source=subprocess.check_output(['git','show',r['tag_name']+':app/build.gradle.kts'],text=True)
              published[r['tag_name']]=int(re.search(r'versionCode\s*=\s*(\d+)',source)[1])
          assert published and max(published.values())<19, 'Candidate versionCode must exceed all published codes.'
          pathlib.Path('app/build/reports').mkdir(parents=True,exist_ok=True)
          pathlib.Path('app/build/reports/v134-release-state.json').write_text(json.dumps({'published_version_codes':published,'candidate':'1.3.4','versionCode':19,'official_signing_verified':False},indent=2))
          PY
      - run: python3 scripts/check-localization.py
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: ./gradlew --no-daemon assembleDebugAndroidTest
      - run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Unsigned Release preflight; never an installable official artifact
        run: |
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease -PreleaseUnsignedCheck=true
          python3 scripts/verify-apk.py app/build/outputs/apk/release/app-release-unsigned.apk --unsigned-preflight --report app/build/reports/v134-unsigned.json
      - uses: actions/upload-artifact@v4
        with:
          name: Sakugapp-v1.3.4-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v134-build-reports
          path: |
            app/build/test-results/
            app/build/reports/lint-results-*.xml
            app/build/reports/v134-unsigned.json
            app/build/reports/v134-release-state.json
  devices:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 28
            profile: Nexus S
          - api: 35
            profile: pixel_c
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: ./scripts/ci-android-sdk.sh
      - uses: gradle/actions/setup-gradle@v5
      - run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/run-v134-checks.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v134-device-reports-${{ matrix.api }}
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/v134-new-tests/
            app/build/reports/ui-evidence/
  upgrade-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: ./scripts/ci-android-sdk.sh
      - uses: gradle/actions/setup-gradle@v5
      - name: Compile the isolated public-UI upgrade checker
        run: ./gradlew --no-daemon -PupgradeUiCheck=true :upgrade-ui-check:assembleDebug :upgrade-ui-check:assembleDebugAndroidTest
      - name: Read the existing public official v1.3.0 APK (no signing Secrets)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v1.3.0 --repo "$GITHUB_REPOSITORY" --pattern Sakugapp-v1.3.0-release.apk --dir "$RUNNER_TEMP/baseline"
      - run: sudo chmod a+rw /dev/kvm
      - name: Validate the new checker on the old official app; NOT a signed candidate upgrade
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: default
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python3 scripts/check-v134-upgrade-baseline.py "$RUNNER_TEMP/baseline/Sakugapp-v1.3.0-release.apk" "$RUNNER_TEMP/baseline-report"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v134-upgrade-baseline-reports
          path: ${{ runner.temp }}/baseline-report/
  evidence:
    concurrency:
      group: v134-evidence
      cancel-in-progress: false
    needs: [build, devices, upgrade-baseline]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: v134-*-reports*
          path: ${{ runner.temp }}/reports
      - env:
          GH_TOKEN: ${{ github.token }}
          V134_INPUT: ${{ runner.temp }}/reports
          V134_OUTPUT: ${{ runner.temp }}/evidence
          V134_RESULT: ${{ needs.build.result == 'success' && needs.devices.result == 'success' && needs.upgrade-baseline.result == 'success' && 'success' || 'failure' }}
        run: python3 scripts/record-v134-evidence.py
      - run: |
          git fetch origin evidence/v134-ui-polish:refs/remotes/origin/evidence/v134-ui-polish || true
          if git show-ref --verify --quiet refs/remotes/origin/evidence/v134-ui-polish; then git switch -c evidence origin/evidence/v134-ui-polish
          else git switch --orphan evidence; git rm -rf --ignore-unmatch .; fi
          cp "$RUNNER_TEMP/evidence/report.json" report.json
          mkdir -p screenshots
          cp "$RUNNER_TEMP/evidence/screenshots/"*.png screenshots/ 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add report.json screenshots
          git commit -m "Record v1.3.4 candidate checks for $GITHUB_SHA" || true
          git push origin HEAD:refs/heads/evidence/v134-ui-polish
