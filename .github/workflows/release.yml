name: Signed Release draft
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      reuse_v130_signed:
        type: boolean
        default: false
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing immutable version tag (run from main or that same tag)'
        required: true
        default: 'v1.3.0'
      reuse_v130_signed:
        description: Revalidate the original protected v1.3.0 signed artifact; never rebuild or change its bytes
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      commit: ${{ steps.target.outputs.commit }}
      tag: ${{ steps.target.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Validate immutable release source
        id: target
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
          REUSE_V130_SIGNED: ${{ inputs.reuse_v130_signed || false }}
        run: |
          python3 - <<'PY'
          import os,sys,subprocess
          sys.path.insert(0,'scripts')
          from release_common import exact_tag
          tag=os.environ['REQUESTED_TAG']
          from_tag=os.environ['GITHUB_REF']=='refs/tags/'+tag
          from_main=os.environ['GITHUB_REF']=='refs/heads/main' and os.environ['GITHUB_EVENT_NAME']=='workflow_dispatch'
          if not (from_tag or from_main):
              raise SystemExit('Release automation must run from main or the same immutable version tag.')
          sha=exact_tag(tag)
          if os.environ['REUSE_V130_SIGNED']=='true':
              assert from_main and tag=='v1.3.0' and sha=='37f5b5515d776ecc53ad8590f14395bb7704bddb'
          subprocess.run(['git','merge-base','--is-ancestor',sha,'origin/main'],check=True)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('commit='+sha+'\ntag='+tag+'\n')
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: ./scripts/ci-android-sdk.sh
      - uses: gradle/actions/setup-gradle@v5
      - name: Release tooling safety tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Release unit tests, Lint and UNSIGNED preflight
        run: ./gradlew --no-daemon --no-configuration-cache testReleaseUnitTest lintRelease assembleRelease -PreleaseUnsignedCheck=true
      - name: Report actual Lint diagnostics
        run: |
          python3 - <<'PY'
          import collections,xml.etree.ElementTree as ET
          issues=ET.parse('app/build/reports/lint-results-release.xml').getroot().findall('issue')
          print('Release Lint diagnostics:',dict(collections.Counter((i.get('severity'),i.get('id')) for i in issues)))
          PY
      - name: Validate unsigned metadata and corresponding source
        env:
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: python3 scripts/prepare-release-bundle.py --tag "$RELEASE_TAG" --apk app/build/outputs/apk/release/app-release-unsigned.apk --unsigned-preflight --output "$RUNNER_TEMP/release-preflight"
      - uses: actions/upload-artifact@v4
        with:
          name: release-preflight-${{ steps.target.outputs.tag }}
          path: ${{ runner.temp }}/release-preflight/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-check-reports
          path: |
            app/build/reports/tests/testReleaseUnitTest/
            app/build/test-results/testReleaseUnitTest/
            app/build/reports/lint-results-release.*
  signed-release:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: release-signing
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 0
      - name: Require protected owner-provided signing Secrets
        if: ${{ !inputs.reuse_v130_signed }}
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        run: python3 scripts/prepare-signing.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: ./scripts/ci-android-sdk.sh
      - uses: gradle/actions/setup-gradle@v5
        if: ${{ !inputs.reuse_v130_signed }}
        with:
          cache-disabled: true
      - name: Build with the existing official signing key
        if: ${{ !inputs.reuse_v130_signed }}
        env:
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --no-configuration-cache --no-build-cache testReleaseUnitTest lintRelease assembleRelease
      - name: Verify pinned signing identity and prepare allowlisted assets
        if: ${{ !inputs.reuse_v130_signed }}
        env:
          ANDROID_RELEASE_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: python3 scripts/prepare-release-bundle.py --tag "$RELEASE_TAG" --apk app/build/outputs/apk/release/app-release.apk --output "$RUNNER_TEMP/release-dist"
      - name: Retrieve the original protected signed artifact
        if: inputs.reuse_v130_signed
        uses: actions/download-artifact@v4
        with:
          name: signed-release-v1.3.0
          run-id: 42329384573
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-dist/
      - name: Reverify original bytes, signing identity, source and allowlisted assets
        if: inputs.reuse_v130_signed
        env:
          ANDROID_RELEASE_CERT_SHA256: 9c77062fa88e1fe35c443641d918d0389354b0eb85395a86504d939ebfc53fff
        run: |
          python3 - <<'PY'
          import os,pathlib,json,hashlib,subprocess,zipfile,runpy
          from scripts.release_common import exact_tag,verify_checksums
          source=exact_tag('v1.3.0');assert source=='37f5b5515d776ecc53ad8590f14395bb7704bddb'
          folder=pathlib.Path(os.environ['RUNNER_TEMP'])/'release-dist'
          expected={'Sakugapp-v1.3.0-release.apk','Sakugapp-v1.3.0-source.zip','release-notes.md','release-verification.json'}
          assert {p.name for p in folder.iterdir()}==expected|{'SHA256SUMS.txt'}
          verify_checksums(folder,expected)
          apk=folder/'Sakugapp-v1.3.0-release.apk'
          assert hashlib.sha256(apk.read_bytes()).hexdigest()=='50da9e14b4c9fbcc3811f19419aedf5a2468d4d49a241cb399ba378a36ce0da1'
          report=json.loads((folder/'release-verification.json').read_text())
          assert report['source_commit']==source and report['source_tag']=='v1.3.0' and report['signed'] and not report['debuggable']
          with zipfile.ZipFile(apk) as z:assert f'revision: "{source}"' in z.read('META-INF/version-control-info.textproto').decode()
          subprocess.run(['python3','scripts/verify-apk.py',str(apk),'--report',str(folder.parent/'reused-apk-verification.json')],check=True)
          runpy.run_path('scripts/verify-source-zip.py')['verify'](folder/'Sakugapp-v1.3.0-source.zip')
          print('Original protected APK and corresponding assets verified unchanged; no signing material accessed.')
          PY
      - name: Upload to DRAFT only
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: python3 scripts/upload-release-draft.py --tag "$RELEASE_TAG" --directory "$RUNNER_TEMP/release-dist"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release-${{ needs.preflight.outputs.tag }}
          path: ${{ runner.temp }}/release-dist/
          if-no-files-found: error
      - name: Remove temporary private signing material
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import os,pathlib,shutil
          value=os.environ.get('ANDROID_RELEASE_KEYSTORE')
          if value:
              folder=pathlib.Path(value).parent.resolve()
              root=pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
              if folder.is_relative_to(root) and folder.name.startswith('sakugapp-signing-'):
                  shutil.rmtree(folder,ignore_errors=True)
          PY
  upgrade-install:
    needs: [preflight, signed-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          # Validation tools can be repaired on main without moving the immutable APK/source tag.
          # The downloaded APK, signature and source_commit are still checked against that tag.
          ref: ${{ github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: signed-release-${{ needs.preflight.outputs.tag }}
          path: ${{ runner.temp }}/release-dist/
      - name: Select the explicit verified upgrade path
        id: previous
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          python3 - <<'PY'
          import os,sys
          sys.path.insert(0,'scripts')
          from release_common import previous_release_tag
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('tag='+previous_release_tag(os.environ['RELEASE_TAG'])+'\n')
          PY
      - name: Download the previous public release
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
        run: gh release download "$PREVIOUS_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*release.apk' --dir "$RUNNER_TEMP/previous-release"
      - run: sudo chmod a+rw /dev/kvm
      - run: ./scripts/ci-android-sdk.sh
      - uses: gradle/actions/setup-gradle@v5
      - name: Build isolated native UI checker
        run: ./gradlew --no-daemon -PupgradeUiCheck=true :upgrade-ui-check:assembleDebug :upgrade-ui-check:assembleDebugAndroidTest
      - name: Verify official upgrade without uninstalling or clearing user data
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: default
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python3 ${{ needs.preflight.outputs.tag == 'v1.3.0' && 'scripts/check-upgrade-1.3.0.py' || needs.preflight.outputs.tag == 'v1.2.2' && 'scripts/check-upgrade-1.2.2.py' || needs.preflight.outputs.tag == 'v1.2.1' && 'scripts/check-upgrade-1.2.1.py' || 'scripts/check-upgrade-install.py' }} "$RUNNER_TEMP/previous-release" "$RUNNER_TEMP/release-dist" "$RUNNER_TEMP/upgrade-install-report"
      - name: Bind passing native upgrade evidence to its validator revision
        if: success() && needs.preflight.outputs.tag == 'v1.3.0'
        run: |
          python3 - <<'PY'
          import os,pathlib,json
          root=pathlib.Path(os.environ['RUNNER_TEMP']);path=root/'upgrade-install-report/upgrade-install.json'
          report=json.loads(path.read_text());bundle=json.loads((root/'release-dist/release-verification.json').read_text())
          assert report['result']=='passed' and report['source_commit']==bundle['source_commit']
          report['validation_commit']=os.environ['GITHUB_SHA'];report['apk_sha256']=bundle['apk_sha256']
          path.write_text(json.dumps(report,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-upgrade-install-report
          path: ${{ runner.temp }}/upgrade-install-report/
  publish-v1-2-0:
    if: (inputs.tag || github.ref_name) == 'v1.2.0'
    needs: [preflight, signed-release, upgrade-install]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: ./scripts/ci-android-sdk.sh
      - uses: actions/download-artifact@v4
        with:
          name: signed-release-v1.2.0
          path: ${{ runner.temp }}/release-dist/
      - name: Publish the explicitly requested version after all gates pass
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIST: ${{ runner.temp }}/release-dist
          PREVIOUS_RELEASE: ${{ runner.temp }}/previous-official
        run: python3 scripts/publish-v1.2.0.py
  publish-v1-2-1:
    if: (inputs.tag || github.ref_name) == 'v1.2.1'
    needs: [preflight, signed-release, upgrade-install]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: ./scripts/ci-android-sdk.sh
      - uses: actions/download-artifact@v4
        with:
          name: signed-release-v1.2.1
          path: ${{ runner.temp }}/release-dist/
      - uses: actions/download-artifact@v4
        with:
          name: release-upgrade-install-report
          path: ${{ runner.temp }}/upgrade-install-report/
      - name: Publish only the requested version after hierarchy, profile and signed-upgrade gates
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIST: ${{ runner.temp }}/release-dist
          PREVIOUS_RELEASE: ${{ runner.temp }}/previous-official
        run: python3 scripts/publish-v1.2.1.py
  publish-v1-2-2:
    if: (inputs.tag || github.ref_name) == 'v1.2.2'
    needs: [preflight, signed-release, upgrade-install]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: ./scripts/ci-android-sdk.sh
      - uses: actions/download-artifact@v4
        with:
          name: signed-release-v1.2.2
          path: ${{ runner.temp }}/release-dist/
      - uses: actions/download-artifact@v4
        with:
          name: release-upgrade-install-report
          path: ${{ runner.temp }}/upgrade-install-report/
      - name: Publish only the requested version after scoped theme, menu and signed-upgrade gates
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIST: ${{ runner.temp }}/release-dist
          PREVIOUS_RELEASE: ${{ runner.temp }}/previous-official
        run: python3 scripts/publish-v1.2.2.py
  publish-v1-3-0:
    if: (inputs.tag || github.ref_name) == 'v1.3.0'
    needs: [preflight, signed-release, upgrade-install]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: ./scripts/ci-android-sdk.sh
      - uses: actions/download-artifact@v4
        with:
          name: signed-release-v1.3.0
          path: ${{ runner.temp }}/release-dist/
      - uses: actions/download-artifact@v4
        with:
          name: release-upgrade-install-report
          path: ${{ runner.temp }}/upgrade-install-report/
      - name: Publish v1.3.0 only after exact-source UI, standard CI, signing and v1.2.2 upgrade gates
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIST: ${{ runner.temp }}/release-dist
          PREVIOUS_RELEASE: ${{ runner.temp }}/previous-official
        run: python3 scripts/publish-v1.3.0.py
