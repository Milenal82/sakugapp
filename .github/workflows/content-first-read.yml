name: Read v1.3.4 release recovery evidence
on:
  push:
    branches: [ci/content-first-read]
permissions:
  actions: read
  contents: write
jobs:
  read:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          run-id: 46001134300
          name: signed-release-v1.3.4
          path: ${{ runner.temp }}/original-signed
      - name: Record original signed metadata and Maven failure (no builds, keys or publication)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,subprocess,re,hashlib
          api=lambda path:json.loads(subprocess.check_output(['gh','api','repos/Milenal82/sakugapp/'+path]))
          run=api('actions/runs/46001134300')
          folder=pathlib.Path(os.environ['RUNNER_TEMP'])/'original-signed'
          result={'run':run['html_url'],'source':run['head_sha'],'artifacts':api('actions/runs/46001134300/artifacts')['artifacts']}
          if (folder/'release-verification.json').exists():
              result.update(signed=json.loads((folder/'release-verification.json').read_text()),checksums=(folder/'SHA256SUMS.txt').read_text(),actual_apk_sha256=hashlib.sha256((folder/'Sakugapp-v1.3.4-release.apk').read_bytes()).hexdigest())
          jobs=api('actions/runs/46001134300/jobs?per_page=100')['jobs']
          result['jobs']=[{'id':j['id'],'name':j['name'],'conclusion':j['conclusion']}for j in jobs]
          for job in jobs:
              if job['name']=='upgrade-install':
                  log=subprocess.run(['gh','api',f'repos/Milenal82/sakugapp/actions/jobs/{job["id"]}/logs'],capture_output=True).stdout.decode(errors='replace')
                  result['maven_failure']='\n'.join(line for line in log.splitlines() if any(x in line for x in ['429','Could not resolve','Could not GET','Could not HEAD','Too Many Requests']))[-15000:]
          try:
              release=api('releases/tags/v1.3.4');result['release']={k:release.get(k)for k in ['id','draft','target_commitish','html_url','tag_name']}
          except Exception:result['release_query_failed']=True
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'report.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
      - name: Preserve bounded public recovery evidence
        run: |
          git fetch origin evidence/v134-recovery-diagnostics:refs/remotes/origin/evidence/v134-recovery-diagnostics || true
          if git show-ref --verify --quiet refs/remotes/origin/evidence/v134-recovery-diagnostics; then git switch -c evidence origin/evidence/v134-recovery-diagnostics
          else git switch --orphan evidence; git rm -rf --ignore-unmatch .; fi
          cp "$RUNNER_TEMP/report.json" report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add report.json
          git commit -m 'Record original v1.3.4 signed release and Maven 429 evidence' || true
          git push origin HEAD:refs/heads/evidence/v134-recovery-diagnostics
