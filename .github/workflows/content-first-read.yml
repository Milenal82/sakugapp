name: Read v1.3.4 PR diagnostics
on:
  push:
    branches: [ci/content-first-read]
permissions:
  actions: read
  contents: write
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45980373724
          pattern: '*reports*'
          path: ${{ runner.temp }}/reports
      - name: Record available bounded test failures only; no builds or signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,subprocess,xml.etree.ElementTree as ET,re
          api=lambda path:json.loads(subprocess.check_output(['gh','api','repos/Milenal82/sakugapp/'+path]))
          run=api('actions/runs/45980373724')
          assert run['head_sha']=='c5f2a9951a7fef6a89cbc2f5ae2925905c27fab9'
          result={'run':run['html_url'],'commit':run['head_sha'],'status':run['status'],'conclusion':run['conclusion'],'reports':[]}
          result['jobs']=[{'name':j['name'],'conclusion':j['conclusion']}for j in api('actions/runs/45980373724/jobs?per_page=100')['jobs']]
          for p in (pathlib.Path(os.environ['RUNNER_TEMP'])/'reports').rglob('TEST-*.xml'):
              if p.stat().st_size>4*1024*1024:continue
              root=ET.parse(p).getroot();failed=[]
              for c in root.iter('testcase'):
                  for e in list(c.findall('failure'))+list(c.findall('error')):
                      text='\n'.join(line for line in (e.text or e.get('message','')).splitlines() if not re.search(r'password|authorization:|cookie:|bearer ',line,re.I))[:12000]
                      failed.append({'case':c.get('classname','')+'.'+c.get('name',''),'message':text})
              result['reports'].append({'path':str(p.relative_to(pathlib.Path(os.environ['RUNNER_TEMP'])/'reports')),'counts':root.attrib,'failures':failed})
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'report.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
      - name: Save diagnostics outside application source
        run: |
          git fetch origin evidence/v134-pr-diagnostics:refs/remotes/origin/evidence/v134-pr-diagnostics || true
          if git show-ref --verify --quiet refs/remotes/origin/evidence/v134-pr-diagnostics; then git switch -c evidence origin/evidence/v134-pr-diagnostics
          else git switch --orphan evidence; git rm -rf --ignore-unmatch .; fi
          cp "$RUNNER_TEMP/report.json" report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add report.json
          git commit -m 'Record bounded PR 4 CI failures for c5f2a99' || true
          git push origin HEAD:refs/heads/evidence/v134-pr-diagnostics
