name: Read v1.3.4 protected publication handoff
on:
  push:
    branches: [ci/content-first-read]
permissions:
  actions: read
  contents: write
jobs:
  read:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 46027674825
          name: v134-handoff-46027674825-1
          path: ${{ runner.temp }}/handoff
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 46027674847
          name: v134-readonly-check-46027674847-1
          path: ${{ runner.temp }}/readonly
      - name: Preserve exact authorization outcome and passing original-byte verification
        run: |
          python3 - <<'PY'
          import pathlib,os,json
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          result={'handoff':json.loads((root/'handoff/v134-handoff.json').read_text()),'readonly':json.loads((root/'readonly/draft-readonly.json').read_text())}
          (root/'report.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
      - name: Save result outside application source
        run: |
          git fetch origin evidence/v134-handoff:refs/remotes/origin/evidence/v134-handoff || true
          if git show-ref --verify --quiet refs/remotes/origin/evidence/v134-handoff; then git switch -c evidence origin/evidence/v134-handoff
          else git switch --orphan evidence; git rm -rf --ignore-unmatch .; fi
          cp "$RUNNER_TEMP/report.json" report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add report.json
          git commit -m 'Record exact v1.3.4 handoff authorization and successful byte verification' || true
          git push origin HEAD:refs/heads/evidence/v134-handoff
