name: Request verified v130 artifact revalidation
on:
  push:
    branches: [ci/player-tools-audit]
permissions:
  contents: read
  actions: write
jobs:
  request:
    if: github.event.head_commit.message == 'Revalidate original signed v1.3.0 with repaired native validators'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check immutable source and successful validator metadata before dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Milenal82/sakugapp
        run: |
          python3 - <<'PY'
          import subprocess,json,time
          repo='Milenal82/sakugapp';validator='753fc83ea2674f24da5927266afa365684507611'
          def api(path):return json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/'+path]))
          assert api('git/ref/heads/main')['object']['sha']==validator
          tag=api('git/ref/tags/v1.3.0')['object'];assert tag['type']=='tag'
          assert api('git/tags/'+tag['sha'])['object']['sha']=='37f5b5515d776ecc53ad8590f14395bb7704bddb'
          deadline=time.monotonic()+10*60
          while True:
              runs=api(f'actions/workflows/refinement.yml/runs?head_sha={validator}&event=push&per_page=20')['workflow_runs']
              matches=[r for r in runs if r['head_sha']==validator and r['head_branch']=='main']
              if matches:
                  latest=max(matches,key=lambda r:r['id'])
                  jobs=api(f'actions/runs/{latest["id"]}/jobs?per_page=100')['jobs']
                  metadata=next((j for j in jobs if j['name']=='metadata'),None)
                  if metadata and metadata['conclusion']=='success':break
                  assert not metadata or metadata['status']!='completed','Validator metadata failed; do not dispatch.'
              assert time.monotonic()<deadline,'Wait for the real metadata gate without skipping it.'
              time.sleep(20)
          payload=json.dumps({'ref':'main','inputs':{'tag':'v1.3.0','reuse_v130_signed':True}})
          subprocess.run(['gh','api','--method','POST',f'repos/{repo}/actions/workflows/release.yml/dispatches','--input','-'],input=payload,text=True,check=True)
          print('Requested official v1.3.0 revalidation using the original protected APK bytes.')
          PY
