name: Sakugapp Debug checks
on:
  push:
    branches: [dev/compact-explore-quiz, dev/debug-actions-grid-artist]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: discovery-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: ./scripts/ci-android-sdk.sh
      - uses: gradle/actions/setup-gradle@v5
      - run: python3 scripts/check-localization.py
      - run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: extension-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extension-build-reports
          path: |
            app/build/test-results/
            app/build/reports/lint-results-debug.*
  devices:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 28
            profile: Nexus S
          - api: 35
            profile: pixel_c
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: ./scripts/ci-android-sdk.sh
      - uses: gradle/actions/setup-gradle@v5
      - run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/run-extension-checks.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extension-device-reports-${{ matrix.api }}
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
            app/build/reports/ui-evidence/
