name: Retry one confirmed v130 emulator offline failure
on:
  push:
    branches: [ci/player-tools-audit]
permissions:
  contents: read
  actions: write
jobs:
  retry:
    if: github.event.head_commit.message == 'Retry one confirmed v130 emulator offline failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Re-run only the identified cleanup failure on the same immutable source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Milenal82/sakugapp
        run: |
          python3 - <<'PY'
          import subprocess,json,time
          repo='Milenal82/sakugapp';run=42267359923;job=128062646857
          def api(path):return subprocess.check_output(['gh','api','--allow-escape-sequences',f'repos/{repo}/'+path])
          meta=json.loads(api(f'actions/runs/{run}'));assert meta['head_sha'].startswith('5c47a78')
          info=json.loads(api(f'actions/jobs/{job}'));assert info['run_id']==run and info['conclusion']=='failure' and info['name']=='six-column-display (phone, Nexus S)'
          log=api(f'actions/jobs/{job}/logs').decode(errors='replace')
          assert 'Tests 2/2 completed. (0 skipped) (0 failed)' in log and 'Finished 2 tests' in log and 'device offline' in log
          deadline=time.monotonic()+15*60
          while json.loads(api(f'actions/runs/{run}'))['status']!='completed':
              assert time.monotonic()<deadline,'Other original checks are still running; do not cancel them.'
              time.sleep(20)
          subprocess.run(['gh','api','--method','POST',f'repos/{repo}/actions/jobs/{job}/rerun'],check=True)
          print('Requested exactly one runner-offline job retry on the original source commit.')
          PY
  resume-final:
    if: github.event.head_commit.message == 'Resume final v130 checks after isolated emulator retry'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Resume cancelled exact-source checks after the old isolated retry ends
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Milenal82/sakugapp
        run: |
          python3 - <<'PY'
          import subprocess,json,time
          repo='Milenal82/sakugapp';old=42267359923;final=42326641755
          def api(path):return json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/'+path]))
          expected='87e7c2863ed696e81fc787fadfc6a14ac7dbd13c'
          meta=api(f'actions/runs/{final}');assert meta['head_sha']==expected and meta['conclusion']=='cancelled'
          deadline=time.monotonic()+15*60
          while api(f'actions/runs/{old}')['status']!='completed':
              assert time.monotonic()<deadline,'Wait for the earlier same-branch concurrency group without cancelling it.'
              time.sleep(20)
          assert api(f'actions/runs/{final}')['head_sha']==expected
          subprocess.run(['gh','api','--method','POST',f'repos/{repo}/actions/runs/{final}/rerun'],check=True)
          print('Restored all required checks on the final source; no workflow or assertion was disabled.')
          PY
