name: Read v1.2.1 upgrade failure evidence
on:
  push:
    branches: [ci/release-1.2.1-diagnostics]
permissions:
  contents: write
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Read only the failed upgrade job and isolated test output
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import subprocess,json,os,pathlib,re,io,zipfile
          repo='Milenal82/sakugapp';run='41290760901'
          report={'run':run,'errors':[],'reports':{}}
          output=pathlib.Path(os.environ['RUNNER_TEMP'])/'release-audit';output.mkdir()
          def api(path):
              result=subprocess.run(['gh','api','--allow-escape-sequences',f'repos/{repo}/'+path],capture_output=True)
              if result.returncode:raise RuntimeError(path+': '+result.stderr.decode(errors='replace')[-2000:])
              return result.stdout
          try:
              jobs=json.loads(api(f'actions/runs/{run}/jobs?per_page=100'))['jobs']
              report['jobs']=[{k:j.get(k) for k in ['name','conclusion','html_url']} for j in jobs]
              job=next(j for j in jobs if j['name'].endswith('upgrade-install'))
              log=api(f'actions/jobs/{job["id"]}/logs').decode(errors='replace')
              report['upgrade_log_tail']=re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]','',log)[-22000:]
              artifacts=json.loads(api(f'actions/runs/{run}/artifacts?per_page=100'))['artifacts']
              for a in artifacts:
                  if a['name']!='release-upgrade-install-report' or a['size_in_bytes']>16*1024*1024:continue
                  with zipfile.ZipFile(io.BytesIO(api(f'actions/artifacts/{a["id"]}/zip'))) as z:
                      for f in z.infolist():
                          if f.file_size>1024*1024:continue
                          name=pathlib.PurePosixPath(f.filename).name
                          if name.endswith(('.json','.txt','.xml')):report['reports'][name]=z.read(f).decode(errors='replace')[-24000:]
                          if name in ['failure.png','v120-seeded.png','v121-upgraded.png']:(output/name).write_bytes(z.read(f))
          except Exception as error:report['errors'].append(type(error).__name__+': '+str(error))
          (output/'report.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - name: Save bounded evidence on its own branch
        run: |
          git fetch origin refs/heads/evidence/maintenance:refs/remotes/origin/evidence/maintenance
          git switch --create release-audit-output origin/evidence/maintenance
          cp "$RUNNER_TEMP/release-audit/report.json" report.json
          mkdir -p release-screens
          cp "$RUNNER_TEMP/release-audit/"*.png release-screens/ 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add report.json release-screens
          git commit -m 'Read isolated v1.2.1 upgrade failure evidence'
          git push origin HEAD:refs/heads/evidence/release-1.2.1
