name: Android checks and artifacts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # Pin the same command-line tools validated locally with JDK 17.
      # SHA-256 verified against the download whose SHA-1 matches Google's repository2-1.xml.
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="$RUNNER_TEMP/sakugapp-sdk"
          curl --fail --location --retry 2 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/android-cli.zip"
          echo "2d2d50857e4eb553af5a6dc3ad507a17adf43d115264b1afc116f95c92e5e258  $RUNNER_TEMP/android-cli.zip" | sha256sum --check
          mkdir -p "$sdk_root/cmdline-tools"
          unzip -q "$RUNNER_TEMP/android-cli.zip" -d "$RUNNER_TEMP/android-cli"
          mv "$RUNNER_TEMP/android-cli/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          # Use a finite input file so pipefail preserves sdkmanager's exit status.
          python3 -c 'print("y\n" * 100)' > "$RUNNER_TEMP/license-answers.txt"
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" --licenses < "$RUNNER_TEMP/license-answers.txt" > "$RUNNER_TEMP/licenses.log"
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v5
      - name: Unit tests, Android Lint and Debug APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Verify APK signature and list packaged ABIs
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | awk '/lib\/.*\.so$/ { print $4 }'
      - name: Package project source
        run: ./scripts/package-source.sh "$RUNNER_TEMP/sakugapp-source.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: sakugapp-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: sakugapp-source
          path: ${{ runner.temp }}/sakugapp-source.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
