name: Android checks and artifacts
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
    inputs:
      update_screenshots:
        description: Copy verified original UI captures into this development branch
        type: boolean
        default: false
      release_tag:
        description: 'Optional: unsigned Release checks and draft source attachment relay for an existing version tag'
        required: false
        default: ''
      sign_release:
        description: 'Use protected signing Secrets and build a DRAFT official APK for release_tag'
        required: false
        type: boolean
        default: false
      build_signed_candidate:
        description: 'Build a signed upgrade candidate on this development branch; artifacts only, no Release changes'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || github.ref_name }}-${{ github.event.inputs.build_signed_candidate == 'true' && 'signed-candidate' || 'checks' }}
  cancel-in-progress: true
jobs:
  documentation-screenshots:
    if: github.event_name == 'workflow_dispatch' && inputs.update_screenshots
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/screenshots.yml
    with:
      run_id: '40392216263'
  build:
    if: ${{ !github.event.inputs.release_tag && github.event.inputs.build_signed_candidate != 'true' && github.event.inputs.update_screenshots != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # Pin the same command-line tools validated locally with JDK 17.
      # SHA-256 verified against the download whose SHA-1 matches Google's repository2-1.xml.
      - name: Prepare Android SDK
        run: ./scripts/ci-android-sdk.sh
      - uses: gradle/actions/setup-gradle@v5
      - name: Verify native localization resources
        run: python3 scripts/check-localization.py
      - name: Unit tests, Android Lint and Debug APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest testReleaseUnitTest lintRelease assembleRelease -PreleaseUnsignedCheck=true
      - name: Verify APK signature and list packaged ABIs
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | awk '/lib\/.*\.so$/ { print $4 }'
      - name: Package project source
        run: ./scripts/package-source.sh "$RUNNER_TEMP/sakugapp-source.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: sakugapp-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: sakugapp-source
          path: ${{ runner.temp }}/sakugapp-source.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
            app/build/test-results/testDebugUnitTest/
            app/build/test-results/testReleaseUnitTest/
            app/build/reports/lint-results-release.*
          if-no-files-found: warn
  device-tests:
    if: ${{ !github.event.inputs.release_tag && github.event.inputs.build_signed_candidate != 'true' && github.event.inputs.update_screenshots != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Enable runner KVM
        run: sudo chmod a+rw /dev/kvm
      - name: Install build SDK
        run: ./scripts/ci-android-sdk.sh
      - name: Run exact-frame, secure-session, persistence and native UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: default
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: ./scripts/run-device-checks.sh
      - name: Explain failed device assertions
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib,xml.etree.ElementTree as ET
          for path in pathlib.Path('app/build/outputs/androidTest-results').rglob('TEST-*.xml'):
              suite=ET.parse(path).getroot()
              for case in suite.findall('testcase'):
                  failure=case.find('failure')
                  if failure is not None:
                      print(case.get('classname'),case.get('name'))
                      print((failure.text or failure.get('message',''))[:12000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/reports/ui-evidence/
          if-no-files-found: warn
  search-back-gestures:
    if: ${{ !github.event.inputs.release_tag && github.event.inputs.build_signed_candidate != 'true' && github.event.inputs.update_screenshots != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - run: sudo chmod a+rw /dev/kvm
      - run: ./scripts/ci-android-sdk.sh
      - name: Verify real edge gestures, IME back and cancelled predictive back
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash ./scripts/run-search-back-checks.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-back-gesture-reports
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/ui-evidence/
  six-column-display:
    if: ${{ !github.event.inputs.release_tag && github.event.inputs.build_signed_candidate != 'true' && github.event.inputs.update_screenshots != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - geometry: phone
            profile: Nexus S
          - geometry: landscape
            profile: pixel_c
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - run: sudo chmod a+rw /dev/kvm
      - run: ./scripts/ci-android-sdk.sh
      - name: Test a fresh physical display without wm overrides
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: default
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: ./scripts/run-six-column-checks.sh ${{ matrix.geometry }}
      - name: Export captures even after an assertion failure
        if: always()
        run: |
          mkdir -p app/build/reports/ui-evidence
          adb pull /sdcard/Download/sakugapp-ui-evidence/. app/build/reports/ui-evidence/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: six-column-${{ matrix.geometry }}-reports
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/ui-evidence/
  release-preflight:
    # Existing workflow entry point also works when a new workflow is not yet indexed.
    # No signing Secrets, no APK attachment, and no public publication.
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' && github.event.inputs.sign_release != 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.release_tag }}
          fetch-depth: 0
      - name: Validate exact version tag and main ancestry
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          python3 - <<'PY'
          import os,sys,subprocess
          sys.path.insert(0,'scripts')
          from release_common import exact_tag
          sha=exact_tag(os.environ['RELEASE_TAG'])
          subprocess.run(['git','merge-base','--is-ancestor',sha,'origin/main'],check=True)
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: ./scripts/ci-android-sdk.sh
      - uses: gradle/actions/setup-gradle@v5
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: ./gradlew --no-daemon --no-configuration-cache testReleaseUnitTest lintRelease assembleRelease -PreleaseUnsignedCheck=true
      - name: Prepare exact-tag source and unsigned verification report
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: python3 scripts/prepare-release-bundle.py --tag "$RELEASE_TAG" --apk app/build/outputs/apk/release/app-release-unsigned.apk --unsigned-preflight --output "$RUNNER_TEMP/release-preflight"
      - uses: actions/upload-artifact@v4
        with:
          name: release-preflight-${{ github.event.inputs.release_tag }}
          path: ${{ runner.temp }}/release-preflight/
          if-no-files-found: error
      - name: Upload source and preflight files to existing DRAFT only
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,subprocess,sys
          sys.path.insert(0,'scripts')
          from release_common import exact_tag,verify_checksums
          tag=os.environ['RELEASE_TAG']
          sha=exact_tag(tag)
          repo=os.environ['GITHUB_REPOSITORY']
          folder=pathlib.Path(os.environ['RUNNER_TEMP'])/'release-preflight'
          expected={f'Sakugapp-{tag}-source.zip','release-notes.md','release-verification.json','SHA256SUMS.txt'}
          if {p.name for p in folder.iterdir()} != expected:
              raise SystemExit('Unexpected preflight assets; no files uploaded.')
          verify_checksums(folder,expected-{'SHA256SUMS.txt'})
          report=json.loads((folder/'release-verification.json').read_text())
          if report.get('signed') is not False or report.get('source_commit') != sha:
              raise SystemExit('Not an unsigned exact-tag preflight.')
          result=subprocess.check_output(['gh','release','view',tag,'--repo',repo,'--json','isDraft,targetCommitish'],text=True)
          release=json.loads(result)
          if not release['isDraft'] or release['targetCommitish'] != sha:
              raise SystemExit('Release is public or targets different source; no changes made.')
          assets=json.loads(subprocess.check_output(['gh','release','view',tag,'--repo',repo,'--json','assets'],text=True))['assets']
          if any(a['name'].endswith('.apk') for a in assets):
              raise SystemExit('A signed APK is already attached; do not overwrite with preflight files.')
          subprocess.run(['gh','release','edit',tag,'--repo',repo,'--notes-file',str(folder/'release-notes.md')],check=True)
          subprocess.run(['gh','release','upload',tag,'--repo',repo,'--clobber']+[str(folder/n) for n in sorted(expected)],check=True)
          print('Source, checksums, notes and unsigned report uploaded to DRAFT. No APK or keys attached.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-check-reports
          path: |
            app/build/reports/tests/testReleaseUnitTest/
            app/build/test-results/testReleaseUnitTest/
            app/build/reports/lint-results-release.*
  release-signing:
    # Reusable workflows are resolved from this commit even before a new workflow is indexed.
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' && github.event.inputs.sign_release == 'true' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ github.event.inputs.release_tag }}
  signed-candidate:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.build_signed_candidate == 'true' && !github.event.inputs.release_tag && startsWith(github.ref, 'refs/heads/feature/')) || (github.event_name == 'push' && github.ref == 'refs/heads/feature/history-tags-refresh') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: release-signing
    steps:
      - uses: actions/checkout@v5
      - name: Use the existing signing identity
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        run: python3 scripts/prepare-signing.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: ./scripts/ci-android-sdk.sh
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: true
      - name: Verify localization and build signed Release variant
        env:
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          python3 scripts/check-localization.py
          ./gradlew --no-daemon --no-configuration-cache --no-build-cache testReleaseUnitTest lintRelease assembleRelease
      - name: Verify official certificate and prepare candidate assets
        env:
          ANDROID_RELEASE_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        run: python3 scripts/package-candidate.py "$RUNNER_TEMP/candidate"
      - uses: actions/upload-artifact@v4
        with:
          name: sakugapp-signed-candidate
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        run: |
          python3 - <<'PY'
          import os,pathlib,shutil
          path=os.environ.get('ANDROID_RELEASE_KEYSTORE')
          if path:
              directory=pathlib.Path(path).parent.resolve()
              if directory.is_relative_to(pathlib.Path(os.environ['RUNNER_TEMP']).resolve()) and directory.name.startswith('sakugapp-signing-'):
                  shutil.rmtree(directory,ignore_errors=True)
          PY
  candidate-upgrade-install:
    needs: signed-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: sakugapp-signed-candidate
          path: ${{ runner.temp }}/candidate/
      - name: Download existing published APK without modifying the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v1.0.0 --repo "$GITHUB_REPOSITORY" --pattern '*release.apk' --dir "$RUNNER_TEMP/previous-release"
      - run: sudo chmod a+rw /dev/kvm
      - run: ./scripts/ci-android-sdk.sh
      - uses: gradle/actions/setup-gradle@v5
      - name: Build isolated native UI checker (not distributed)
        run: ./gradlew --no-daemon -PupgradeUiCheck=true :upgrade-ui-check:assembleDebug :upgrade-ui-check:assembleDebugAndroidTest
      - name: Verify same-certificate upgrade and retained preferences/history
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: default
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python3 scripts/check-upgrade-install.py "$RUNNER_TEMP/previous-release" "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/upgrade-install-report"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-upgrade-install-report
          path: ${{ runner.temp }}/upgrade-install-report/
  checks-evidence:
    needs: [build, device-tests, six-column-display, search-back-gestures]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/feature/history-tags-refresh' }}
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/evidence.yml
  candidate-evidence:
    needs: [signed-candidate, candidate-upgrade-install]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/feature/history-tags-refresh' }}
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/evidence.yml
