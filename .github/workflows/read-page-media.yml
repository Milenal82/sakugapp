name: Read page media device evidence
on:
  push:
    branches: [ci/page-media-audit]
permissions:
  contents: write
  actions: read
jobs:
  persistence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: ./scripts/ci-android-sdk.sh
      - uses: gradle/actions/setup-gradle@v5
      - run: sudo chmod a+rw /dev/kvm
      - name: Download the exact tested Debug APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 42080069440 --repo Milenal82/sakugapp --name sakugapp-debug --dir "$RUNNER_TEMP/application"
      - run: ./gradlew --no-daemon -PupgradeUiCheck=true :upgrade-ui-check:assembleDebug :upgrade-ui-check:assembleDebugAndroidTest
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python3 scripts/verify-directory-restart.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: directory-restart-report
          path: ${{ runner.temp }}/directory-restart.txt
  read:
    if: always()
    needs: persistence
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Read reports and bounded failed test logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import subprocess,pathlib,json,os,xml.etree.ElementTree as ET,re
          repo='Milenal82/sakugapp';run='42080069440'
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'page-audit';out.mkdir()
          def api(path):return subprocess.check_output(['gh','api','--allow-escape-sequences',f'repos/{repo}/'+path])
          meta=json.loads(api('actions/runs/'+run));v={'source_commit':meta['head_sha'],'run':run,'run_url':meta['html_url'],'failures':[],'counts':[],'logs':[]}
          subprocess.run(['gh','run','download',run,'--repo',repo,'--pattern','*reports*','--dir',str(out/'input')],check=True)
          subprocess.run(['gh','run','download',os.environ['GITHUB_RUN_ID'],'--repo',repo,'--name','directory-restart-report','--dir',str(out/'restart')],check=True)
          for p in (out/'input').rglob('TEST-*.xml'):
              root=ET.parse(p).getroot();v['counts'].append({'path':str(p.relative_to(out)),'attributes':root.attrib})
              for c in root.iter('testcase'):
                  for f in list(c.findall('failure'))+list(c.findall('error')):v['failures'].append({'test':c.get('classname')+'.'+c.get('name'),'path':str(p.relative_to(out)),'message':(f.text or '')[:16000]})
          jobs=json.loads(api('actions/runs/'+run+'/jobs?per_page=100'))['jobs']
          for j in jobs:
              if j['conclusion']=='failure':
                  log=api('actions/jobs/'+str(j['id'])+'/logs').decode(errors='replace');v['logs'].append({'name':j['name'],'tail':re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]','',log)[-20000:]})
          v['directory_restart']=(out/'restart/directory-restart.txt').read_text()
          (out/'report.json').write_text(json.dumps(v,indent=2)+'\n')
          PY
      - name: Store report on independent evidence branch
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin evidence/page-media-regression >/dev/null; then
            git fetch origin refs/heads/evidence/page-media-regression:refs/remotes/origin/evidence/page-media-regression
            git switch -c audit-output origin/evidence/page-media-regression
          else
            git switch --orphan audit-output
          fi
          cp "$RUNNER_TEMP/page-audit/report.json" report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add report.json
          git commit -m 'Record failed page-media test evidence'
          git push origin HEAD:refs/heads/evidence/page-media-regression
